# iPhone / iPad build (docs/ios.md): an unsigned IPA of Dead Rising recompiled from YOUR
# default.xex and shader archive.
#
# Two repositories (as lm-ios / lm-ios-data):
#  - this one (public: GitHub-hosted Mac minutes are free) holds only source code and runs this
#    workflow;
#  - a PRIVATE data repository (repository variable GAME_DATA_REPO, e.g. you/deadrising-ios-data)
#    holds default.xex and shader.arc (release "game-data", uploaded by scripts/ios/publish-data.ps1)
#    and receives the finished IPA and the full build log (release "ios-<run number>").
# Secret GAME_DATA_TOKEN: a fine-grained token with Contents read/write on the data repository.
#
# Nothing derived from the game goes into this repository: no artifacts, no caches of generated
# code (they are kept in the private data repository, release "build-cache"), and the public log
# shows no generated code (messages about ppc/ are only counted).
name: iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      DATA_REPO: ${{ vars.GAME_DATA_REPO }}
      GH_TOKEN: ${{ secrets.GAME_DATA_TOKEN }}
      TAG: ios-${{ github.run_number }}
      MOLTENVK_VERSION: v1.4.2 # (v1.2.11 has no release files)
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # Compiler cache (ccache): kept in the PRIVATE data repository (release "build-cache"), never here.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CCACHE_MAXSIZE: 1500M
    steps:
      - name: Check the data repository
        run: |
          if [ -z "$DATA_REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the repository variable GAME_DATA_REPO and the secret GAME_DATA_TOKEN (docs/ios.md)."
            exit 1
          fi
          vis=$(gh repo view "$DATA_REPO" --json visibility -q .visibility)
          echo "data repository visibility: $vis"
          if [ "$vis" != "PRIVATE" ]; then
            echo "::error::The data repository must be private: it holds your game files and the IPA."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Get default.xex and shader.arc (private data repository)
        run: |
          mkdir -p "$RUNNER_TEMP/gamedata"
          gh release download game-data --repo "$DATA_REPO" -p default.xex -p shader.arc -D "$RUNNER_TEMP/gamedata" --clobber
          for f in default.xex shader.arc; do
            echo "$f: $(stat -f %z "$RUNNER_TEMP/gamedata/$f") bytes, SHA-1 $(shasum -a 1 "$RUNNER_TEMP/gamedata/$f" | cut -d' ' -f1)"
          done

      - name: Tools (Xcode, Ninja, PowerShell)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          brew list ninja >/dev/null 2>&1 || brew install ninja
          command -v pwsh || brew install --cask powershell
          command -v ccache >/dev/null || brew install ccache >/dev/null
          command -v zstd >/dev/null || brew install zstd >/dev/null
          cmake --version | head -1
          ccache --version | head -1

      # Builds reuse what did not change (about 8 min -> 3 min). Everything made from the game (the
      # generated code and the compiled objects) is kept as assets of the PRIVATE data repository's
      # release "build-cache", never in this public repository's caches.
      - name: Reuse earlier builds (private data repository)
        id: caches
        run: |
          gh release view build-cache --repo "$DATA_REPO" >/dev/null 2>&1 ||
            gh release create build-cache --repo "$DATA_REPO" --title "Build cache" \
              --notes "Generated game code and compiled objects reused by the iOS builds. Private: made from your game files." >/dev/null
          # The generated code depends only on the game files, the tools, their patches and the config.
          key=$( { shasum -a 1 "$RUNNER_TEMP/gamedata/default.xex" "$RUNNER_TEMP/gamedata/shader.arc" | cut -d' ' -f1
                   git ls-tree HEAD tools/XenonRecomp tools/XenosRecomp
                   cat patches/XenonRecomp-deadrising.patch patches/XenosRecomp-deadrising.patch scripts/ios/codegen.sh scripts/unarc.ps1 xfb2xenos/main.cpp
                   find config -type f | LC_ALL=C sort | xargs cat; } | shasum -a 256 | cut -c1-16 )
          echo "CODEGEN_KEY=$key" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/cache" "$RUNNER_TEMP/ccache"
          if gh release download build-cache --repo "$DATA_REPO" -p "codegen-$key.tar.zst" -D "$RUNNER_TEMP/cache" --clobber 2>/dev/null &&
             zstd -dc -q "$RUNNER_TEMP/cache/codegen-$key.tar.zst" | tar -xf -; then
            echo "codegen=hit" >> "$GITHUB_OUTPUT"
            echo "generated game code: reused ($key)"
          else
            echo "codegen=miss" >> "$GITHUB_OUTPUT"
            echo "generated game code: made this time ($key)"
          fi
          if gh release download build-cache --repo "$DATA_REPO" -p ccache.tar -D "$RUNNER_TEMP/cache" --clobber 2>/dev/null; then
            tar -xf "$RUNNER_TEMP/cache/ccache.tar" -C "$RUNNER_TEMP/ccache"
            echo "compiler cache: $(du -sh "$RUNNER_TEMP/ccache" | cut -f1)"
          else
            echo "compiler cache: empty (first build)"
          fi
          rm -rf "$RUNNER_TEMP/cache"
          ccache -z >/dev/null

      - name: MoltenVK (Vulkan on Metal)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/moltenvk.tar" "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VERSION/MoltenVK-ios.tar"
          mkdir -p "$RUNNER_TEMP/moltenvk" && tar -xf "$RUNNER_TEMP/moltenvk.tar" -C "$RUNNER_TEMP/moltenvk"
          fw=$(find "$RUNNER_TEMP/moltenvk" -path "*dynamic*" -path "*ios-arm64/MoltenVK.framework" -type d | grep -v simulator | head -1)
          test -n "$fw" || { echo "::error::MoltenVK.framework (dynamic, ios-arm64) not found"; find "$RUNNER_TEMP/moltenvk" -maxdepth 5 -type d | head -50; exit 1; }
          echo "MOLTENVK_FRAMEWORK=$fw" >> "$GITHUB_ENV"
          echo "MoltenVK: $fw"

      # FFmpeg holds nothing from the game: this repository's own cache keeps it.
      - name: FFmpeg from earlier builds
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-ios
          key: ffmpeg-n7.1-ios16-arm64-${{ hashFiles('scripts/ffmpeg/configure.sh') }}

      - name: FFmpeg (XMA audio decoder only)
        run: |
          echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg-ios" >> "$GITHUB_ENV"
          if [ "${{ steps.ffmpeg-cache.outputs.cache-hit }}" = "true" ] && ls "$RUNNER_TEMP/ffmpeg-ios/lib/"*.a >/dev/null 2>&1; then
            echo "FFmpeg: reused"; ls "$RUNNER_TEMP/ffmpeg-ios/lib"; exit 0
          fi
          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git "$RUNNER_TEMP/ffmpeg"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          sh scripts/ffmpeg/configure.sh "$RUNNER_TEMP/ffmpeg" "$RUNNER_TEMP/ffmpeg-build" \
            --enable-cross-compile --target-os=darwin --arch=arm64 --cc="$(xcrun --sdk iphoneos -f clang)" \
            --sysroot="$sdk" --extra-cflags="-arch arm64 -miphoneos-version-min=16.0" \
            --extra-ldflags="-arch arm64 -miphoneos-version-min=16.0" --prefix="$RUNNER_TEMP/ffmpeg-ios"
          make -C "$RUNNER_TEMP/ffmpeg-build" -j"$(sysctl -n hw.ncpu)" install > "$RUNNER_TEMP/ffmpeg-make.log" 2>&1 ||
            { tail -40 "$RUNNER_TEMP/ffmpeg-make.log"; exit 1; }
          ls -l "$RUNNER_TEMP/ffmpeg-ios/lib"

      - name: Generate the game code and shaders (from your files)
        run: |
          log="$RUNNER_TEMP/codegen.log"
          set +e
          # Reused (steps.caches): only the tools' patches are applied (the runtime builds against them).
          DR_CODEGEN_PATCH_ONLY=${{ steps.caches.outputs.codegen == 'hit' && '1' || '0' }} \
            bash scripts/ios/codegen.sh "$RUNNER_TEMP/gamedata/default.xex" "$RUNNER_TEMP/gamedata/shader.arc" > "$log" 2>&1
          status=$?
          set -e
          mkdir -p "$RUNNER_TEMP/out" && cp "$log" "$RUNNER_TEMP/out/codegen-${{ github.run_number }}.log"
          cp analysis/shader_cache/xenosrecomp.log "$RUNNER_TEMP/out/xenosrecomp-${{ github.run_number }}.log" 2>/dev/null || true
          # Public log: steps and errors only (no generated code, no per-shader lines).
          grep -E "^==>|applied|error|generated|exit status|dxcompiler|^diag:" "$log" | grep -v -E "ppc/|Translated|FAILED" | head -150 || true
          exit $status

      - name: Configure (iOS arm64)
        run: |
          cmake -S runtime -B build/ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-Xclang -fno-pch-timestamp" \
            -DDR_MOLTENVK_FRAMEWORK="$MOLTENVK_FRAMEWORK" \
            -DDR_FFMPEG_DIR="$FFMPEG_DIR" \
            -DDR_SHADER_CACHE="$PWD/analysis/shader_cache/shader_cache.cpp" \
            -DDR_SHADER_KEYS="$PWD/analysis/shaders_2008/shader_keys.cpp"

      - name: Build
        id: build
        run: |
          log="$RUNNER_TEMP/out/build-${{ github.run_number }}.log"
          set +e
          cmake --build build/ios --target DRRecomp -- -k 0 > "$log" 2>&1
          status=$?
          set -e
          gen=$(grep -c "ppc/" "$log" || true)
          echo "build exit status $status; $gen log lines mention generated game code (see the private build log)"
          grep -E "(error|warning):|FAILED:|Error [0-9]+" "$log" | grep -v "ppc/" | head -300 || true
          tail -5 "$log" | grep -v "ppc/" || true
          exit $status

      - name: Package the IPA
        run: |
          app=$(find build/ios -maxdepth 2 -name "DeadRising.app" -type d | head -1)
          test -n "$app" || { echo "::error::DeadRising.app not found"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist"
          file "$app/DeadRising"
          ls "$app/Frameworks" || true
          du -sh "$app"
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R "$GITHUB_WORKSPACE/$app" Payload/
          zip -qry "out/DeadRising-${{ github.run_number }}.ipa" Payload
          cp "$GITHUB_WORKSPACE/runtime/ios/DeadRising.entitlements" out/
          # The executable's symbols, sorted by address: names the offsets in "[crash]" lines. Private
          # (the recompiled functions are named after the game's addresses), so only into the release.
          nm -n "$GITHUB_WORKSPACE/$app/DeadRising" 2>/dev/null | gzip -9 > "out/DeadRising-${{ github.run_number }}.symbols.gz" || true
          echo "symbols: $(gzip -dc "out/DeadRising-${{ github.run_number }}.symbols.gz" | wc -l) lines"
          ls -lh out

      - name: Deliver to the private data repository
        if: always()
        run: |
          cd "$RUNNER_TEMP/out" 2>/dev/null || exit 0
          ok="${{ job.status }}"
          title="iOS build ${{ github.run_number }}"
          [ "$ok" = "success" ] || title="$title - FAILED (logs only)"
          notes="From ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}, run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Install with SideStore, AltStore, Sideloadly or LiveContainer, keeping the entitlements (docs/ios.md). Copy your game folder to Files > On My iPhone > Dead Rising > game."
          # GitHub's API sometimes answers 500: try a few times (a half-made release is uploaded to).
          for attempt in 1 2 3 4; do
            if gh release view "$TAG" --repo "$DATA_REPO" >/dev/null 2>&1; then
              gh release upload "$TAG" --repo "$DATA_REPO" --clobber ./* && break
            else
              gh release create "$TAG" --repo "$DATA_REPO" --title "$title" --notes "$notes" ./* && break
            fi
            echo "attempt $attempt failed, retrying"; sleep $((attempt * 15))
          done
          gh release view "$TAG" --repo "$DATA_REPO" >/dev/null
          echo "Delivered to the private repository: release $TAG"

      # After the IPA is delivered: what this build made, for the next one (private data repository).
      - name: Keep the generated code for the next build (private data repository)
        if: always() && steps.caches.outputs.codegen == 'miss'
        run: |
          test -s analysis/shader_cache/shader_cache.cpp && ls ppc/*.cpp >/dev/null 2>&1 || { echo "nothing generated: not kept"; exit 0; }
          file="$RUNNER_TEMP/codegen-$CODEGEN_KEY.tar.zst"
          tar -cf - ppc analysis/shader_cache analysis/shaders_2008/shader_keys.cpp | zstd -T0 -10 -q -o "$file"
          echo "generated code: $(du -h "$file" | cut -f1)"
          for old in $(gh release view build-cache --repo "$DATA_REPO" --json assets --jq '.assets[].name | select(startswith("codegen-"))'); do
            gh release delete-asset build-cache "$old" --repo "$DATA_REPO" -y >/dev/null || true
          done
          for attempt in 1 2 3; do
            gh release upload build-cache "$file" --repo "$DATA_REPO" --clobber && break
            sleep $((attempt * 10))
          done

      - name: Keep the compiler cache for the next build (private data repository)
        if: always() && steps.build.outcome != 'skipped'
        run: |
          ccache -s | grep -E -i "hits|misses|cache size" || true
          ccache --evict-older-than 21d >/dev/null 2>&1 || true
          tar -cf "$RUNNER_TEMP/ccache.tar" -C "$CCACHE_DIR" .
          echo "compiler cache: $(du -h "$RUNNER_TEMP/ccache.tar" | cut -f1)"
          for attempt in 1 2 3; do
            gh release upload build-cache "$RUNNER_TEMP/ccache.tar" --repo "$DATA_REPO" --clobber && break
            sleep $((attempt * 10))
          done
